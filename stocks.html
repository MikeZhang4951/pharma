<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Watchlist</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#21262d;--text:#e2e8f0;--muted:#64748b;--green:#10b981;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;padding:16px}
.header{text-align:center;margin-bottom:16px}
.header h1{font-size:1.1rem;font-weight:800;color:var(--muted);letter-spacing:0.05em}
.header h1 span{color:var(--text)}
.time{font-size:0.65rem;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;transition:all 0.3s}
.card:hover{border-color:#363b47}
.sym{font-weight:800;font-size:0.8rem}
.name{font-size:0.55rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:1rem;font-weight:700;margin-top:6px}
.chg{font-size:0.7rem;font-weight:700;margin-top:1px}
.vol{font-size:0.5rem;color:var(--muted);margin-top:3px}
.up{border-left:3px solid var(--green)} .down{border-left:3px solid var(--red)} .flat{border-left:3px solid var(--muted)}
.green{color:var(--green)} .red{color:var(--red)} .dim{color:var(--muted)}
.loader{text-align:center;padding:40px;color:var(--muted);font-size:0.75rem}
.summary{text-align:center;font-size:0.65rem;color:var(--muted);margin-top:12px}
.summary span{margin:0 6px}
.summary .g{color:var(--green)} .summary .r{color:var(--red)}
</style>
</head>
<body>
<div class="header"><h1><span>Stock</span> Watchlist</h1><div class="time" id="time">loading...</div></div>
<div class="grid" id="grid"><div class="loader">Fetching live data...</div></div>
<div class="summary" id="summary"></div>
<script>
async function load(){
  try{
    const r=await fetch('/stocks/data');
    const d=await r.json();
    document.getElementById('time').textContent='Updated: '+d.updated+(d.stale?' (cached)':'');
    if(!d.tickers||!d.tickers.length){document.getElementById('grid').innerHTML='<div class="loader">No data</div>';return}
    let up=0,down=0,flat=0,html='';
    d.tickers.forEach(t=>{
      const pct=t.change_pct;let cls='flat',arr='';
      if(pct>0.05){cls='up';arr='+';up++}else if(pct<-0.05){cls='down';down++}else{flat++}
      const ps=t.price?'$'+t.price.toFixed(2):'--';
      const pctStr=pct!=null?arr+pct.toFixed(2)+'%':'--';
      const vs=t.volume?(t.volume>1e6?(t.volume/1e6).toFixed(1)+'M':(t.volume/1e3).toFixed(0)+'K'):'';
      html+=`<div class="card ${cls}"><div class="sym">${t.ticker}</div><div class="name">${t.name||''}</div><div class="price">${ps}</div><div class="chg ${cls==='up'?'green':cls==='down'?'red':'dim'}">${pctStr}</div><div class="vol">${vs?'Vol: '+vs:''}</div></div>`
    });
    document.getElementById('grid').innerHTML=html;
    document.getElementById('summary').innerHTML=`<span class="g">+${up}</span><span class="r">-${down}</span><span>${flat} flat</span>`
  }catch(e){document.getElementById('grid').innerHTML='<div class="loader" style="color:var(--red)">Failed to load</div>'}
}
load();setInterval(load,30000);
</script>
</body>
</html>
