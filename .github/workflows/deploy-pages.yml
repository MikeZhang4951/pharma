name: Deploy Payout Curve Designer to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build static site artifact
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            index.html
            national-summary.css
            national-summary.js
            territories.json
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required site file is missing or empty"
              exit 1
            fi
          done

          node --check national-summary.js
          python -m json.tool territories.json > /dev/null

          rm -rf _site
          mkdir _site
          cp "${required_files[@]}" _site/
          touch _site/.nojekyll

          echo "Prepared GitHub Pages artifact:"
          find _site -maxdepth 1 -type f -printf '%f\n' | sort
          test -s index.html
          test -s national-summary.css
          test -s national-summary.js
          python -m json.tool territories.json > /dev/null
          grep -Fq "fetch('./territories.json')" index.html
          grep -Fq "typeof renderNationalSummaries === 'function'" index.html
          python - <<'PY'
          from pathlib import Path
          page = Path("index.html").read_text()
          inline_end = page.rfind("</script>", 0, page.rfind('<script src="./national-summary.js"></script>'))
          extension = page.rfind('<script src="./national-summary.js"></script>')
          assert inline_end != -1 and inline_end < extension, "national summary must load after the core app"
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html national-summary.css national-summary.js territories.json _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
