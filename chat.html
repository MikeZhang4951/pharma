<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Hermes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#e2e8f0; font-family:system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  .header { background:#161b22; border-bottom:1px solid #3a3a5e; padding:12px 20px; text-align:center; }
  .header h1 { font-size:1.1rem; color:#818cf8; }
  .header .status { font-size:0.65rem; color:#64748b; margin-top:2px; }
  .header .status.connected { color:#34d399; }
  .header .status.disconnected { color:#ef4444; }
  .messages { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:8px; font-size:0.75rem; line-height:1.5; animation:fadeIn 0.2s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-self:flex-end; background:#6366f1; color:#fff; border-bottom-right-radius:2px; }
  .msg.hermes { align-self:flex-start; background:#161b22; border:1px solid #2a2a4e; border-bottom-left-radius:2px; }
  .msg.hermes .label { color:#818cf8; font-weight:700; font-size:0.6rem; margin-bottom:4px; }
  .msg .time { font-size:0.5rem; opacity:0.5; margin-top:4px; text-align:right; }
  .msg.loading { opacity:0.6; }
  .msg.loading .dots::after { content:''; animation:dots 1.5s infinite; }
  @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
  .input-area { background:#161b22; border-top:1px solid #3a3a5e; padding:12px 20px; display:flex; gap:10px; }
  .input-area input { flex:1; background:#0d1117; color:#e2e8f0; border:1px solid #3a3a5e; border-radius:6px; padding:10px 14px; font-size:0.8rem; outline:none; }
  .input-area input:focus { border-color:#818cf8; }
  .input-area input:disabled { opacity:0.4; }
  .input-area button { background:#6366f1; color:#fff; border:none; border-radius:6px; padding:10px 20px; cursor:pointer; font-size:0.8rem; font-weight:600; }
  .input-area button:hover { background:#818cf8; }
  .input-area button:disabled { opacity:0.4; cursor:not-allowed; }
  .empty-state { flex:1; display:flex; align-items:center; justify-content:center; color:#4a4a6e; font-size:0.8rem; }
  @media (max-width:600px) { .msg { max-width:92%; } .input-area input { font-size:0.7rem; } }
</style>
</head>
<body>
<div class="header">
  <h1>Hermes Chat</h1>
  <div class="status" id="status">connecting...</div>
</div>
<div class="messages" id="messages">
  <div class="empty-state">Send a message to start</div>
</div>
<div class="input-area">
  <input type="text" id="input" placeholder="Type a message..." disabled autofocus>
  <button id="sendBtn" disabled>Send</button>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
let ws = null;
let emptyState = document.querySelector('.empty-state');

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = protocol + '//' + location.hostname + ':8082';
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'status connected';
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  };

  ws.onclose = () => {
    statusEl.textContent = 'disconnected — reconnecting...';
    statusEl.className = 'status disconnected';
    input.disabled = true;
    sendBtn.disabled = true;
    setTimeout(connect, 2000);
  };

  ws.onmessage = (event) => {
    removeLoading();
    if (emptyState) { emptyState.remove(); emptyState = null; }
    const data = JSON.parse(event.data);
    addMessage('hermes', data.text, data.time);
  };

  ws.onerror = () => {};
}

function addMessage(type, text, time) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (type === 'hermes') {
    div.innerHTML = `<div class="label">Hermes</div>${escapeHtml(text)}<div class="time">${time || ''}</div>`;
  } else {
    div.innerHTML = `${escapeHtml(text)}<div class="time">${time || ''}</div>`;
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addLoading() {
  const div = document.createElement('div');
  div.className = 'msg hermes loading';
  div.id = 'loadingMsg';
  div.innerHTML = `<div class="label">Hermes</div><span class="dots">Thinking</span>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loadingMsg');
  if (el) el.remove();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

function send() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (emptyState) { emptyState.remove(); emptyState = null; }
  const time = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  addMessage('user', text, time);
  ws.send(JSON.stringify({text}));
  addLoading();
  input.value = '';
  input.focus();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
sendBtn.addEventListener('click', send);
connect();
</script>
</body>
</html>
