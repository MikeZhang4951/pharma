<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Health</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#06060d;color:#e0e0e0;
  font-family:'SF Mono','Cascadia Code','Consolas',monospace;
  min-height:100vh;padding:20px;
}
h1{font-size:18px;color:#a78bfa;margin-bottom:4px}
.sub{font-size:11px;color:#666;margin-bottom:20px}
.status-bar{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:#0d0d1a;border:1px solid #1a1a2e;border-radius:8px;
  margin-bottom:16px;
}
.dot{width:10px;height:10px;border-radius:50%}
.dot.green{background:#4ade80;box-shadow:0 0 8px #4ade80}
.dot.red{background:#f87171;box-shadow:0 0 8px #f87171}
.all-up{font-size:14px;font-weight:600}
.timestamp{font-size:11px;color:#666;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.card{
  background:#0d0d1a;border:1px solid #1a1a2e;border-radius:8px;
  padding:14px;transition:all 0.3s;
}
.card.up{border-color:rgba(74,222,128,0.3)}
.card.down{border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.05)}
.card .name{font-size:12px;color:#888;margin-bottom:4px}
.card .port{font-size:24px;font-weight:700}
.card .pid{font-size:11px;color:#666;margin-top:4px}
.card .status{font-size:11px;margin-top:4px}
.card .status.live{color:#4ade80}
.card .status.dead{color:#f87171}
.sys-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.sys-grid{grid-template-columns:1fr}}
.sys-card{
  background:#0d0d1a;border:1px solid #1a1a2e;border-radius:8px;
  padding:16px;text-align:center;
}
.sys-card .label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.sys-card .value{font-size:22px;font-weight:700}
.sys-card .bar-bg{
  height:6px;background:#1a1a2e;border-radius:3px;margin-top:8px;overflow:hidden;
}
.sys-card .bar{height:100%;border-radius:3px;transition:width 1s}
.bar.green{background:#4ade80}
.bar.yellow{background:#fbbf24}
.bar.red{background:#f87171}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #1a1a2e;border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>⚡ System Health <span id="spinner" class="spinner" style="display:none"></span></h1>
<div class="sub" id="sub">Loading...</div>

<div class="status-bar" id="status-bar">
  <span class="dot" id="overall-dot"></span>
  <span class="all-up" id="overall-text">—</span>
  <span class="timestamp" id="ts">—</span>
</div>

<div class="grid" id="service-grid"></div>

<h2 style="font-size:14px;color:#a78bfa;margin-bottom:12px">System</h2>
<div class="sys-grid">
  <div class="sys-card">
    <div class="label">CPU</div>
    <div class="value" id="sys-cpu">—</div>
    <div class="bar-bg"><div class="bar green" id="bar-cpu" style="width:0%"></div></div>
  </div>
  <div class="sys-card">
    <div class="label">Memory</div>
    <div class="value" id="sys-mem">—</div>
    <div class="bar-bg"><div class="bar" id="bar-mem" style="width:0%"></div></div>
  </div>
  <div class="sys-card">
    <div class="label">Disk</div>
    <div class="value" id="sys-disk">—</div>
    <div class="bar-bg"><div class="bar" id="bar-disk" style="width:0%"></div></div>
  </div>
</div>
<div style="font-size:11px;color:#666;margin-top:10px;text-align:center">
  Uptime: <span id="sys-uptime">—</span>
</div>

<script>
async function refresh(){
  document.getElementById('spinner').style.display='inline';
  try{
    const r=await fetch('/api/health');const d=await r.json();
    document.getElementById('ts').textContent=d.timestamp;
    document.getElementById('sub').textContent='Auto-refresh 10s';
    document.getElementById('spinner').style.display='none';

    // Overall
    const dot=document.getElementById('overall-dot');
    dot.className='dot '+(d.all_up?'green':'red');
    document.getElementById('overall-text').textContent=d.all_up?'All systems operational':'⚠️ Some services down';
    document.getElementById('overall-text').style.color=d.all_up?'#4ade80':'#f87171';

    // Services
    const grid=document.getElementById('service-grid');
    grid.innerHTML=d.services.map(s=>{
      const cls=s.up?'up':'down';
      const st=s.up?'LIVE':'DOWN';
      const stc=s.up?'live':'dead';
      return `<div class="card ${cls}">
        <div class="name">${esc(s.name)}</div>
        <div class="port" style="color:${s.up?'#4ade80':'#f87171'}">:${s.port}</div>
        <div class="pid">${s.pid?'PID '+s.pid:'—'}</div>
        <div class="status ${stc}">● ${st}</div>
      </div>`;
    }).join('');

    // System
    const sys=d.system;
    document.getElementById('sys-cpu').textContent=sys.cpu+'%';
    document.getElementById('sys-mem').textContent=sys.memory.pct+'%';
    document.getElementById('sys-disk').textContent=sys.disk.pct;
    document.getElementById('sys-uptime').textContent=sys.uptime;

    // Bars
    updateBar('bar-cpu',parseFloat(sys.cpu)||0);
    updateBar('bar-mem',parseFloat(sys.memory.pct)||0);
    updateBar('bar-disk',parseInt(sys.disk.pct)||0);
  }catch(e){
    document.getElementById('sub').textContent='Fetch error: '+e.message;
    document.getElementById('spinner').style.display='none';
  }
}

function updateBar(id,pct){
  const bar=document.getElementById(id);
  bar.style.width=pct+'%';
  bar.className='bar '+(pct<50?'green':pct<80?'yellow':'red');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
